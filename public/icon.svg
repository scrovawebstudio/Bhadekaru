<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="112" fill="url(#shineGrad)" />

  <!-- Architectural roof accent lines -->
  <path d="M 128 200 L 256 100 L 384 200" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 160 200 L 256 125 L 352 200" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />

  <!-- Center Devanagari 'भा' Lettermark for Bhadekaru -->
  <g filter="url(#dropShadow)">
    <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Plus Jakarta Sans', sans-serif" font-size="230" font-weight="900" fill="#ffffff" text-anchor="middle">भा</text>
  </g>

  <!-- Modern property dot indicator -->
  <circle cx="256" cy="420" r="12" fill="#38bdf8" />
</svg>
